<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo - Buhobot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght=400;700;900&display=swap');
        body { font-family: 'Nunito', sans-serif; background-color: #131f24; }
    </style>
</head>
<body class="text-gray-200 min-h-screen flex bg-[#131f24]">

    <aside class="w-64 border-r-2 border-[#37464f] h-screen p-6 flex flex-col justify-between fixed left-0 top-0 bg-[#131f24]">
        <div>
            <div class="mb-8 px-2">
                <h1 class="text-3xl font-black text-[#58cc02] tracking-wide">duolingo</h1>
            </div>
            <nav class="space-y-2">
                <a href="{% url 'home' %}" class="flex items-center gap-4 text-[#afbbca] hover:bg-[#202f36] hover:text-[#58cc02] font-extrabold px-4 py-3 rounded-xl tracking-wider text-sm uppercase transition">
                    <i class="fa-solid fa-house text-lg"></i> Aprender
                </a>
                <a href="{% url 'buhobot' %}" class="flex items-center gap-4 bg-[#202f36] border-2 border-[#4c9700] text-[#58cc02] font-extrabold px-4 py-3 rounded-xl tracking-wider text-sm uppercase">
                    <i class="fa-solid fa-robot text-lg"></i> Buhobot
                </a>
            </nav>
        </div>

        <div class="border-t-2 border-[#37464f] pt-4 space-y-3">
            <div>
                <label class="text-xs font-black text-gray-400 uppercase tracking-wider block mb-1">Nivel Idioma</label>
                <select id="select-nivel" class="w-full bg-[#202f36] border-2 border-[#37464f] text-white p-2 rounded-xl font-bold text-sm outline-none">
                    <option value="A1">Principiante (A1)</option>
                    <option value="A2" selected>Básico (A2)</option>
                    <option value="B1">Intermedio (B1)</option>
                </select>
            </div>
            <div>
                <label class="text-xs font-black text-gray-400 uppercase tracking-wider block mb-1">Escenario</label>
                <select id="select-escenario" class="w-full bg-[#202f36] border-2 border-[#37464f] text-white p-2 rounded-xl font-bold text-sm outline-none">
                    <option value="Restaurante">🍔 Restaurante</option>
                    <option value="Aeropuerto">✈️ Aeropuerto</option>
                    <option value="Conocer a alguien">👋 Conocer a alguien</option>
                    <option value="Tienda de ropa">🛍️ Tienda de ropa</option>
                </select>
            </div>
            <button id="btn-ayuda" class="w-full bg-[#fff] text-[#131f24] hover:bg-gray-200 font-black py-2 rounded-xl text-xs uppercase tracking-wide transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-life-ring"></i> Obtener /Ayuda
            </button>
        </div>
    </aside>

    <main class="flex-1 ml-64 p-8 flex flex-col h-screen max-w-3xl mx-auto">
        <div class="flex items-center gap-4 border-b-2 border-[#37464f] pb-4 mb-4">
            <div class="text-4xl bg-[#202f36] p-2 rounded-full border-2 border-[#37464f]">🦉</div>
            <div>
                <h2 class="text-xl font-black text-white tracking-wide">Buhobot</h2>
                <span class="text-xs text-[#58cc02] font-black uppercase tracking-wider flex items-center gap-1">
                    <span class="w-2 h-2 bg-[#58cc02] rounded-full inline-block animate-pulse"></span> En línea • Tutor IA
                </span>
            </div>
        </div>

        <div id="caja-chat" class="flex-1 overflow-y-auto pr-2 space-y-4 no-scrollbar">
            <div class="flex items-start gap-3 max-w-[80%]">
                <div class="text-2xl mt-1 select-none">🦉</div>
                <div class="bg-[#202f36] border-2 border-[#37464f] text-gray-200 p-4 rounded-2xl rounded-tl-none font-bold text-sm shadow-md">
                    ¡Hello! I am your Duolingo virtual assistant. Let's practice. What would you like to order today?
                </div>
            </div>
        </div>

        <form id="form-chat" class="mt-4 flex items-center gap-3 bg-[#1a282f] border-2 border-[#37464f] p-3 rounded-2xl shadow-xl">
            {% csrf_token %}
            <input type="text" id="mensaje-input" placeholder="Escribe tu mensaje en inglés..." autocomplete="off" required
                class="flex-1 bg-transparent text-white font-bold text-sm outline-none px-2">
            
            <button type="submit" class="bg-[#1cb0f6] border-b-4 border-[#1894ce] hover:bg-[#24bfff] text-white font-black p-3 rounded-xl transition shadow-md flex items-center justify-center">
                <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
        </form>
    </main>

    <script>
        let chatHistory = []; // Memoria persistente del cliente

        // Mensajes iniciales según escenario
        const initialMessages = {
            "Restaurante": "¡Hello! I am your Duolingo virtual assistant. Let's practice. What would you like to order today?",
            "Aeropuerto": "¡Hello! I am your Duolingo virtual assistant. Let's practice. What do you need help with at the airport?",
            "Conocer a alguien": "¡Hello! I am your Duolingo virtual assistant. Let's practice. How would you like to start the conversation?",
            "Tienda de ropa": "¡Hello! I am your Duolingo virtual assistant. Let's practice. What are you looking for in our clothing store?"
        };

        // Función para obtener el mensaje inicial
        function getInitialMessage(scenario) {
            return initialMessages[scenario] || initialMessages["Restaurante"];
        }

        // Función para reiniciar el chat con nuevo escenario
        function resetChatWithScenario(scenario) {
            const cajaChat = document.getElementById('caja-chat');
            const message = getInitialMessage(scenario);
            
            cajaChat.innerHTML = `
            <div class="flex items-start gap-3 max-w-[80%]">
                <div class="text-2xl mt-1 select-none">🦉</div>
                <div class="bg-[#202f36] border-2 border-[#37464f] text-gray-200 p-4 rounded-2xl rounded-tl-none font-bold text-sm shadow-md">
                    ${message}
                </div>
            </div>`;
            
            chatHistory = [];
            cajaChat.scrollTop = cajaChat.scrollHeight;
        }

        // --- Seguridad en cliente: control de dominio y prompt injection ---
        function isDomainViolation(message, scenario) {
            const m = message.toLowerCase();
            if (scenario === 'Restaurante') {
                const airportWords = ['ticket','flight','luggage','airport','boarding','check in','passport','baggage','plane','depart','arrival','flight'];
                return airportWords.some(w => m.includes(w));
            }
            return false;
        }

        function isPromptInjection(message) {
            const m = message.toLowerCase();
            const injPhrases = ['forget your rules','forget the rules','you are now','now you are','ignore your instructions','override your'];
            for (const p of injPhrases) if (m.includes(p)) return true;
            const dangerous = ['bomb','detonate','weapon','explode','harm','kill','secret ingredients'];
            for (const k of dangerous) if (m.includes(k)) return true;
            return false;
        }

        function appendBotMessage(text) {
            const cajaChat = document.getElementById('caja-chat');
            const botHtml = `
            <div class="flex items-start gap-3 max-w-[80%]">
                <div class="text-2xl mt-1 select-none">🦉</div>
                <div class="bg-[#202f36] border-2 border-[#37464f] text-gray-200 p-4 rounded-2xl rounded-tl-none font-bold text-sm shadow-md">
                    ${text}
                </div>
            </div>`;
            cajaChat.insertAdjacentHTML('beforeend', botHtml);
            chatHistory.push({"role": "assistant", "content": text});
            cajaChat.scrollTop = cajaChat.scrollHeight;
        }

        // Evento para cambio de escenario
        document.getElementById('select-escenario').addEventListener('change', function() {
            resetChatWithScenario(this.value);
        });

        // Evento de Envío de Mensaje
        document.getElementById('form-chat').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const input = document.getElementById('mensaje-input');
            const mensajeTexto = input.value.trim();
            if (!mensajeTexto) return;

            const cajaChat = document.getElementById('caja-chat');

            // 1. Añadir el mensaje del estudiante a la pantalla
            const userHtml = `
            <div class="flex items-start gap-3 max-w-[80%] ml-auto flex-row-reverse">
                <div class="text-2xl mt-1 select-none">👤</div>
                <div class="bg-[#1cb0f6] text-white p-4 rounded-2xl rounded-tr-none font-bold text-sm shadow-md">
                    ${mensajeTexto}
                </div>
            </div>`;
            cajaChat.insertAdjacentHTML('beforeend', userHtml);
            input.value = '';
            cajaChat.scrollTop = cajaChat.scrollHeight;

            // Guardar en el historial del script
            chatHistory.push({"role": "user", "content": mensajeTexto});

            const escenario = document.getElementById('select-escenario').value;

            // Comprobaciones de seguridad/alcance en cliente
            if (isPromptInjection(mensajeTexto)) {
                appendBotMessage("I can't assist with that.");
                return;
            }

            if (isDomainViolation(mensajeTexto, escenario)) {
                appendBotMessage("Sorry, this is a " + escenario.toLowerCase() + ". Would you like to see the menu?");
                return;
            }

            // 2. Mostrar indicador de carga "Búho pensando..."
            const loadingId = 'loading-' + Date.now();
            const loadingHtml = `
            <div id="${loadingId}" class="flex items-start gap-3 max-w-[80%]">
                <div class="text-2xl mt-1 select-none">🦉</div>
                <div class="bg-[#202f36] border-2 border-[#37464f] text-gray-400 p-4 rounded-2xl rounded-tl-none font-bold text-sm animate-pulse">
                    Thinking...
                </div>
            </div>`;
            cajaChat.insertAdjacentHTML('beforeend', loadingHtml);
            cajaChat.scrollTop = cajaChat.scrollHeight;

            // 3. Realizar la petición HTTP POST asíncrona hacia Django
            try {
                const response = await fetch(window.location.href, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify({
                        message: mensajeTexto,
                        level: document.getElementById('select-nivel').value,
                        scenario: escenario,
                        history: chatHistory
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId).remove(); // Quitar animación de carga

                if (data.status === "success") {
                    appendBotMessage(data.reply);
                } else {
                    alert("Error en el tutor: " + data.message);
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                console.error(err);
            }
        });

        // Evento para el botón especial de /Ayuda
        document.getElementById('btn-ayuda').addEventListener('click', function() {
            const input = document.getElementById('mensaje-input');
            input.value = "/ayuda";
            document.getElementById('form-chat').dispatchEvent(new Event('submit'));
        });

        

        // Inicializar con el mensaje correcto al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            const escenarioActual = document.getElementById('select-escenario').value;
            resetChatWithScenario(escenarioActual);
        });
    </script>
</body>
</html>
